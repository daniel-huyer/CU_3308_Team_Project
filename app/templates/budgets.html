{% extends 'base.html' %}

{% block title %}Budgets - JGT Finance{% endblock %}

{% block styles %}<!-- page specific style sheet if wanted -->{% endblock %}
<!-- header/nav get's included from base.html -->
<!-- start main -->
{% block content %}
    <h1>Budgets</h1>
    <h3>Hi {{ current_user.username }},</h3>
    <p>Welcome to your Budgets</p>

    <hr />

    <h2 id="budget-form-title">Add Budget</h2>

    <form id="budget-form">
        <!-- Stores the budget ID while editing -->
        <input
            type="hidden"
            id="budget_id"
            name="budget_id"
        />

        <label for="category_id">Category</label>
        <br />

        <select
            id="category_id"
            name="category_id"
            required
        >
            <option value="">Select Category</option>
        </select>

        <br /><br />

        <label for="month">Month</label>
        <br />

        <input
            type="month"
            id="month"
            name="month"
            required
        />

        <br /><br />

        <label for="limit_amount">Budget Limit</label>
        <br />

        <input
            type="number"
            id="limit_amount"
            name="limit_amount"
            step="0.01"
            min="0"
            placeholder="0.00"
            required
        />

        <br /><br />

        <button type="submit" id="budget-submit">
            Add Budget
        </button>

        <button
            type="button"
            id="cancel-budget-edit"
            hidden
        >
            Cancel Edit
        </button>
    </form>

    <p id="budget-message" role="status"></p>

    <hr />

    <h2>Budget List</h2>

    <div style="overflow-x: auto;">
        <table id="budget-table">
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Category</th>
                    <th>Limit</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="budget-table-body">
                <tr>
                    <td colspan="4">
                        Loading budgets...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form =
                document.getElementById("budget-form");

            const budgetIdInput =
                document.getElementById("budget_id");

            const categoryInput =
                document.getElementById("category_id");

            const monthInput =
                document.getElementById("month");

            const limitInput =
                document.getElementById("limit_amount");

            const submitButton =
                document.getElementById("budget-submit");

            const cancelButton =
                document.getElementById(
                    "cancel-budget-edit"
                );

            const formTitle =
                document.getElementById(
                    "budget-form-title"
                );

            const message =
                document.getElementById(
                    "budget-message"
                );

            const tableBody =
                document.getElementById(
                    "budget-table-body"
                );

            initializePage();

            async function initializePage() {
                setDefaultMonth();

                await loadCategories();
                await loadBudgets();
            }

            form.addEventListener(
                "submit",
                async function (event) {
                    event.preventDefault();

                    const budgetId =
                        budgetIdInput.value.trim();

                    const isEditing =
                        budgetId !== "";

                    if (!categoryInput.value) {
                        message.textContent =
                            "Please select a category.";
                        return;
                    }

                    if (!monthInput.value) {
                        message.textContent =
                            "Please select a month.";
                        return;
                    }

                    if (!limitInput.value) {
                        message.textContent =
                            "Please enter a budget limit.";
                        return;
                    }

                    const budgetData = {
                        category_id: Number(
                            categoryInput.value
                        ),
                        month: monthInput.value,
                        limit_amount: Number(
                            limitInput.value
                        )
                    };

                    const url = isEditing
                        ? `/api/budgets/${budgetId}`
                        : "/api/budgets";

                    const method = isEditing
                        ? "PUT"
                        : "POST";

                    message.textContent = isEditing
                        ? "Updating budget..."
                        : "Adding budget...";

                    submitButton.disabled = true;

                    try {
                        const response = await fetch(
                            url,
                            {
                                method: method,
                                headers: {
                                    "Content-Type":
                                        "application/json",
                                    "Accept":
                                        "application/json"
                                },
                                body: JSON.stringify(
                                    budgetData
                                )
                            }
                        );

                        const result =
                            await response.json();

                        if (
                            !response.ok ||
                            result.status !== "success"
                        ) {
                            throw new Error(
                                result.message ||
                                "Unable to save the budget."
                            );
                        }

                        message.textContent =
                            result.message ||
                            (
                                isEditing
                                    ? "Budget updated successfully."
                                    : "Budget created successfully."
                            );

                        resetBudgetForm();
                        await loadBudgets();

                    } catch (error) {
                        console.error(
                            "Budget request failed:",
                            error
                        );

                        message.textContent =
                            error.message ||
                            "An unexpected error occurred.";

                    } finally {
                        submitButton.disabled = false;
                    }
                }
            );

            cancelButton.addEventListener(
                "click",
                function () {
                    resetBudgetForm();

                    message.textContent =
                        "Edit cancelled.";
                }
            );

            function setDefaultMonth() {
                if (monthInput.value) {
                    return;
                }

                const currentDate =
                    new Date();

                const year =
                    currentDate.getFullYear();

                const month = String(
                    currentDate.getMonth() + 1
                ).padStart(2, "0");

                monthInput.value =
                    `${year}-${month}`;
            }

            function resetBudgetForm() {
                form.reset();

                budgetIdInput.value = "";

                categoryInput.disabled = false;
                monthInput.disabled = false;

                setDefaultMonth();

                formTitle.textContent =
                    "Add Budget";

                submitButton.textContent =
                    "Add Budget";

                cancelButton.hidden = true;
            }

            function beginBudgetEdit(budget) {
                budgetIdInput.value =
                    budget.id;

                categoryInput.value =
                    String(budget.category_id);

                monthInput.value =
                    budget.month;

                limitInput.value =
                    budget.limit_amount;

                /*
                 * The PUT route currently updates
                 * only the budget limit.
                 */
                categoryInput.disabled = true;
                monthInput.disabled = true;

                formTitle.textContent =
                    "Edit Budget";

                submitButton.textContent =
                    "Update Budget";

                cancelButton.hidden = false;

                message.textContent =
                    `Editing budget ${budget.id}.`;

                form.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }

            async function loadCategories() {
                try {
                    const response = await fetch(
                        "/api/categories",
                        {
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );

                    const result =
                        await response.json();

                    if (
                        !response.ok ||
                        result.status !== "success"
                    ) {
                        throw new Error(
                            result.message ||
                            "Unable to load categories."
                        );
                    }

                    categoryInput.innerHTML =
                        '<option value="">Select Category</option>';

                    result.data.forEach(
                        function (category) {
                            const option =
                                document.createElement(
                                    "option"
                                );

                            option.value =
                                category.id;

                            option.textContent =
                                category.name;

                            categoryInput.appendChild(
                                option
                            );
                        }
                    );

                } catch (error) {
                    console.error(
                        "Unable to load categories:",
                        error
                    );

                    categoryInput.innerHTML =
                        '<option value="">Unable to load categories</option>';

                    categoryInput.disabled = true;

                    message.textContent =
                        error.message ||
                        "Unable to load categories.";
                }
            }

            async function loadBudgets() {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="4">
                            Loading budgets...
                        </td>
                    </tr>
                `;

                try {
                    const response = await fetch(
                        "/api/budgets",
                        {
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );

                    const result =
                        await response.json();

                    if (
                        !response.ok ||
                        result.status !== "success"
                    ) {
                        throw new Error(
                            result.message ||
                            "Unable to load budgets."
                        );
                    }

                    renderBudgets(result.data);

                } catch (error) {
                    console.error(
                        "Unable to load budgets:",
                        error
                    );

                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="4">
                                Unable to load budgets.
                            </td>
                        </tr>
                    `;

                    message.textContent =
                        error.message ||
                        "Unable to load budgets.";
                }
            }

            function renderBudgets(budgets) {
                tableBody.innerHTML = "";

                if (
                    !Array.isArray(budgets) ||
                    budgets.length === 0
                ) {
                    const row =
                        document.createElement(
                            "tr"
                        );

                    const cell =
                        document.createElement(
                            "td"
                        );

                    cell.colSpan = 4;
                    cell.textContent =
                        "No budgets found.";

                    row.appendChild(cell);
                    tableBody.appendChild(row);

                    return;
                }

                budgets.forEach(
                    function (budget) {
                        const row =
                            document.createElement(
                                "tr"
                            );

                        const monthCell =
                            document.createElement(
                                "td"
                            );

                        monthCell.textContent =
                            budget.month;

                        const categoryCell =
                            document.createElement(
                                "td"
                            );

                        categoryCell.textContent =
                            budget.category_name ||
                            `Category ${budget.category_id}`;

                        const limitCell =
                            document.createElement(
                                "td"
                            );

                        limitCell.textContent =
                            `$${Number(
                                budget.limit_amount
                            ).toFixed(2)}`;

                        const actionsCell =
                            document.createElement(
                                "td"
                            );

                        const editButton =
                            document.createElement(
                                "button"
                            );

                        editButton.type =
                            "button";

                        editButton.textContent =
                            "Edit";

                        editButton.addEventListener(
                            "click",
                            function () {
                                beginBudgetEdit(
                                    budget
                                );
                            }
                        );

                        actionsCell.appendChild(
                            editButton
                        );

                        row.appendChild(
                            monthCell
                        );

                        row.appendChild(
                            categoryCell
                        );

                        row.appendChild(
                            limitCell
                        );

                        row.appendChild(
                            actionsCell
                        );

                        tableBody.appendChild(
                            row
                        );
                    }
                );
            }
        });
    </script>
{% endblock %}
<!-- end main -->
<!-- footer get's included from base.html -->
