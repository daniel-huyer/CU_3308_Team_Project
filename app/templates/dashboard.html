{% extends 'base.html' %}
{% block title %}Dashboard - JGT Finance{% endblock %}
{% block styles %}<!-- page specific style sheet if wanted -->{% endblock %}
<!-- header/nav get's included from base.html -->
<!-- start main -->
{% block content %}
    <h1>Dashboard</h1>
    <h3>Hi {{ current_user.username }},</h3>

    <div class="card-grid">
        <div class="card">
            <div class="form-group"><label>Current Balance</label></div>
            <h2 id="balance">$0.00</h2>
        </div>
        <div class="card">
            <div class="form-group"><label>Income</label></div>
            <h2 id="income" class="amount-income">$0.00</h2>
        </div>
        <div class="card">
            <div class="form-group"><label>Expenses</label></div>
            <h2 id="expenses" class="amount-expense">$0.00</h2>
        </div>
    </div>

    <div class="card-grid">
        <div class="card">
            <div class="form-group"><label>Spending Trend (30 Days)</label></div>
            <canvas id="spending-trend-chart" height="200"></canvas>
        </div>
        <div class="card">
            <div class="form-group"><label>Spending by Category (This Month)</label></div>
            <canvas id="category-breakdown-chart" height="200"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="form-group"><label>Recent Transactions</label></div>
        <div id="recent-transactions"></div>
    </div>

    <a href="#" class="btn btn-primary">+ Add Transaction</a>
{% endblock %}
<!-- end main -->
<!-- footer get's included from base.html -->
