{% extends 'base.html' %}

{% block title %}Change Password - JGT Finance{% endblock %}

{% block styles %}<!-- page specific style sheet if wanted -->{% endblock %}
<!-- header/nav get's included from base.html -->
<!-- start main -->
{% block content %}
    <h1>Change Password</h1>
    <h3>Hi {{ current_user.username }}</h3>
    <hr />

    <form id="change-password-form"
        method="POST" action="{{ url_for('auth.change_password') }}">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input 
                type="password"
                id="current_password"
                name="current_password"
                required
            />
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                required
            />
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            />
        </div>
        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}
        {% if success %}
            <p class="success-message">{{ success }}</p>
        {% endif %}
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Change Password</button>
        </div>
    </form>

    <p id="change-password-message" role="status"></p>
{% endblock %}
<!-- end main -->
<!-- footer get's included from base.html -->
